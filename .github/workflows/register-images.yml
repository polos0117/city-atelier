name: 그림 등록

# 그림 저장소(city-atelier-img)의 img/ 를 읽어 data/img.json 에 적고(records 로 일상컷 색인 data/casual-index.json 도) 되커밋한다.
# 깨우는 길은 셋이다(원소 공방과 같다).
#   repository_dispatch — 그림 저장소의 썸네일 워크플로가 끝나면서 보낸다(토큰이 있을 때).
#   schedule            — 뒤받침. GitHub 시간표는 자주 밀리고 빠진다(원소 공방에서 8시간에 1번 돈 적이 있다).
#   workflow_dispatch   — 기다리기 싫으면 Actions 에서 "Run workflow".
# 달라진 것이 없으면 커밋하지 않는다. 썸네일은 그림 저장소의 워크플로가 만든다.
on:
  repository_dispatch:
    types: [images-updated]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: '적혀 있는데 파일이 없는 항목도 지운다'
        type: boolean
        default: false

concurrency:
  group: register-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 그림 저장소를 옆에 받아 img/ 로 잇는다. img/ 는 .gitignore 라 커밋에 안 들어간다
      - uses: actions/checkout@v4
        with:
          repository: polos0117/city-atelier-img
          path: img-repo

      # 그림이 아직 없으면 폴더도 없다 — 빈 폴더를 만들어 두고 잇는다
      - name: 그림 자리 잇기
        run: |
          mkdir -p img-repo/img && ln -s img-repo/img img && ls img | head -20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 무엇이 달라지는지 먼저 찍어 둔다. 이름이 틀린 파일이 있으면 여기서 실패한다
      - name: 대조
        run: python3 tools/register-images.py --check

      - name: 등록
        run: |
          if [ "${{ inputs.prune || github.event.client_payload.prune }}" = "true" ]; then
            python3 tools/register-images.py --prune
          else
            python3 tools/register-images.py
          fi

      # 일상컷 색인(2026-11-25 — 크게 보기 · 허브 즐겨찾기의 일상컷 설명): 그림 저장소 records 의 일상컷 기록 · 계획 파일을 읽어 data/casual-index.json.
      # 저장소가 없으면 쓰지 않는다(반쪽 색인 막기). 줄이 같으면 파일을 안 바꾼다. 깨져도 등록(img.json)은 그대로 커밋한다
      - name: 일상컷 색인
        continue-on-error: true
        run: node tools/casual-index.cjs --repos img-repo && node tests/casual-index.cjs

      # 자료·등록기·화면이 같은 말을 하는지 — 깨지면 커밋하지 않는다
      - name: 검사
        run: |
          node tests/img-shards.cjs
          python3 tests/register-images.py

      - name: 되커밋
        run: |
          if git diff --quiet -- data/img.json data/casual-index.json && [ -z "$(git ls-files --others --exclude-standard -- data/casual-index.json)" ]; then
            echo "달라진 것 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/img.json data/casual-index.json
          git commit -m "자동 등록: 그림 저장소의 새 그림을 data/img.json 에 · 일상컷 색인 [skip actions]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
